name: CRAG CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

jobs:

  # ==========================================================
  # 1. Continuous Integration
  # ==========================================================
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint code
        run: echo "Linting repository"

      - name: Run unit tests
        run: echo "Running unit tests"


  # ==========================================================
  # 2. Build Docker image and push to Amazon ECR
  # ==========================================================
  build-and-push-ecr-image:
    name: Build and Push Docker Image
    needs: integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: latest
        run: |
          docker build             -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" .

          docker push             "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"


  # ==========================================================
  # 3. Deploy on EC2 self-hosted runner
  # ==========================================================
  continuous-deployment:
    name: Deploy to EC2
    needs: build-and-push-ecr-image

    # The GitHub Actions runner installed on your EC2 instance
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull latest Docker image
        run: |
          docker pull             "${{ secrets.AWS_ECR_LOGIN_URI }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest"

      - name: Stop existing container
        run: |
          docker stop crag || true

      - name: Remove existing container
        run: |
          docker rm -fv crag || true

      - name: Run Docker container
        run: |
          docker run -d             -p 8080:8080             --name=crag             --restart unless-stopped             -e GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}"             -e GROQ_MODEL="${{ secrets.GROQ_MODEL }}"             -e GROQ_MODEL2="${{ secrets.GROQ_MODEL2 }}"             -e LANGSMITH_TRACING="${{ secrets.LANGSMITH_TRACING }}"             -e LANGSMITH_ENDPOINT="${{ secrets.LANGSMITH_ENDPOINT }}"             -e LANGSMITH_API_KEY="${{ secrets.LANGSMITH_API_KEY }}"             -e LANGSMITH_PROJECT="${{ secrets.LANGSMITH_PROJECT }}"             "${{ secrets.AWS_ECR_LOGIN_URI }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest"

      - name: Verify container
        run: |
          sleep 5
          docker ps
          docker logs --tail 50 crag

      - name: Clean unused Docker images
        run: |
          docker image prune -f
