name: CRAG CI/CD
on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: crag_ecr

jobs:

  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run lint checks
        run: |
          echo "Running lint checks..."
          # Add your actual lint command here if required.

      - name: Run unit tests
        run: |
          echo "Running unit tests..."
          # Add your actual test command here if required.


  build-and-push:
    name: Build and Push Docker Image
    needs: integration
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image-info.outputs.image_tag }}
      image_uri: ${{ steps.image-info.outputs.image_uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::YOUR_AWS_ACCOUNT_ID:role/GitHubActions-ECR-Role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-CRAG

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image information
        id: image-info
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-info.outputs.image_tag }}
        run: |
          docker build             -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"             -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"             .

      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-info.outputs.image_tag }}
        run: |
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"


  deploy-to-ec2:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          GROQ_MODEL2: ${{ secrets.GROQ_MODEL2 }}

          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: AWS_REGION,ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,GROQ_API_KEY,GROQ_MODEL,GROQ_MODEL2,LANGSMITH_TRACING,LANGSMITH_ENDPOINT,LANGSMITH_API_KEY,LANGSMITH_PROJECT

          script: |
            set -e

            echo "Starting EC2 deployment..."
            echo "Image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

            echo "Checking EC2 IAM role..."
            aws sts get-caller-identity

            echo "Logging into Amazon ECR..."
            aws ecr get-login-password               --region "${AWS_REGION}"               | docker login                 --username AWS                 --password-stdin "${ECR_REGISTRY}"

            echo "Pulling new image..."
            docker pull "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

            echo "Stopping old container..."
            docker stop crag 2>/dev/null || true

            echo "Removing old container..."
            docker rm crag 2>/dev/null || true

            echo "Starting new container..."
            docker run -d               --name crag               --restart unless-stopped               -p 8080:8080               -e GROQ_API_KEY="${GROQ_API_KEY}"               -e GROQ_MODEL="${GROQ_MODEL}"               -e GROQ_MODEL2="${GROQ_MODEL2}"               -e LANGSMITH_TRACING="${LANGSMITH_TRACING}"               -e LANGSMITH_ENDPOINT="${LANGSMITH_ENDPOINT}"               -e LANGSMITH_API_KEY="${LANGSMITH_API_KEY}"               -e LANGSMITH_PROJECT="${LANGSMITH_PROJECT}"               "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

            echo "Running container:"
            docker ps

            echo "Recent logs:"
            docker logs --tail 50 crag

            docker image prune -f

            echo "Deployment completed successfully."
